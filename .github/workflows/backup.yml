name: backup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Volcado de la base de datos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm postgres:17 pg_dump "$DB_URL" \
            --schema=public --no-owner --no-privileges -Fc > backup.dump
          ls -lh backup.dump

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 30
